paths:
  /api/v1/applications:
    get:
      description: Returns a list of applications
      operationId: fetch_all_applications
      parameters:
      - description: Filter Apps by the teamId
        explode: true
        in: query
        name: teamId
        required: false
        schema:
          type: integer
        style: form
      - description: Search term to filter by application name or description.
        explode: true
        in: query
        name: text
        required: false
        schema:
          type: string
        style: form
      - description: Filter by application status is enabled or not (true or false).
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - "1"
          - "0"
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fetch_all_applications_200_response"
          description: Success
      summary: ApplicationController@index
      tags:
      - Application
      x-accepts:
      - application/json
    post:
      description: Creates application
      operationId: create_applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/create_applications_request"
        description: Application definition
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_applications_200_response"
          description: Success
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_applications_500_response"
          description: Error
      security:
      - bearerAuth: []
      summary: ApplicationController@store
      tags:
      - Application
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/applications/{id}:
    delete:
      description: Delete application
      operationId: delete_applications
      parameters:
      - description: application id
        example: "1"
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: application id
          type: integer
        style: simple
      responses:
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/update_applications_404_response"
          description: Not found response
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/delete_applications_200_response"
          description: Success
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_applications_500_response"
          description: Error
      security:
      - bearerAuth: []
      summary: ApplicationController@delete
      tags:
      - Application
      x-accepts:
      - application/json
    get:
      description: Get application by id
      operationId: fetch_applications
      parameters:
      - description: application id
        example: "1"
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: application id
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fetch_applications_200_response"
          description: Success response
      security:
      - bearerAuth: []
      summary: ApplicationController@show
      tags:
      - Application
      x-accepts:
      - application/json
    patch:
      description: Edit application
      operationId: edit_applications
      parameters:
      - description: application id
        example: "1"
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: application id
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/edit_applications_request"
        description: ActivityLog definition
        required: true
      responses:
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/update_applications_404_response"
          description: Not found response
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/update_applications_200_response"
          description: Success
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_applications_500_response"
          description: Error
      security:
      - bearerAuth: []
      summary: ApplicationController@edit
      tags:
      - Application
      x-content-type: application/json
      x-accepts:
      - application/json
    put:
      description: Update application
      operationId: update_applications
      parameters:
      - description: application id
        example: "1"
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: application id
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/update_applications_request"
        description: ActivityLog definition
        required: true
      responses:
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/update_applications_404_response"
          description: Not found response
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/update_applications_200_response"
          description: Success
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_applications_500_response"
          description: Error
      security:
      - bearerAuth: []
      summary: ApplicationController@update
      tags:
      - Application
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/applications/{id}/clientid:
    patch:
      description: Generate Client ID application
      operationId: patch_applications_client_id
      parameters:
      - description: application id
        example: "1"
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: application id
          type: integer
        style: simple
      responses:
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/update_applications_404_response"
          description: Not found response
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/update_applications_200_response"
          description: Success
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_applications_500_response"
          description: Error
      security:
      - bearerAuth: []
      summary: ApplicationController@generateClientIdById
      tags:
      - Application
      x-accepts:
      - application/json
  /api/v1/auth:
    post:
      description: Generate Jwt based on email and password
      operationId: authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/authentication_request"
        description: Pass user credentials
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/authentication_200_response"
          description: Success response
        "401":
          description: Missing Property
      summary: AuthController@checkAuthorization
      tags:
      - Authentication
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/auth/register:
    post:
      description: Register a new user with email and password
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/register_request"
        description: Pass user registration data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/register_200_response"
          description: Success response
        "400":
          description: Validation error
        "409":
          description: Email already exists
      summary: AuthController@register
      tags:
      - Authentication
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/auth/login:
    post:
      description: Login with email and password
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/login_request"
        description: Pass user credentials
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/register_200_response"
          description: Success response
        "400":
          description: Validation error
        "401":
          description: Invalid credentials
      summary: AuthController@login
      tags:
      - Authentication
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/cancer-type-filters:
    get:
      description: Returns a hierarchical tree of cancer type filters
      operationId: getCancerTypeFilters
      parameters:
      - description: Filter by parent ID
        explode: true
        in: query
        name: parent_id
        required: false
        schema:
          type: integer
        style: form
      - description: Filter by hierarchy level
        explode: true
        in: query
        name: level
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getCancerTypeFilters_200_response"
          description: Success response
      security:
      - bearerAuth: []
      summary: Get all cancer type filters
      tags:
      - CancerTypeFilter
      x-accepts:
      - application/json
  /api/v1/cancer-type-filters/{filter_id}:
    get:
      description: Returns a single cancer type filter with its children by filter_id
      operationId: getCancerTypeFilter
      parameters:
      - description: "Filter ID (e.g., 0_0, 0_0_2_59)"
        example: '0_0_2_59'
        explode: false
        in: path
        name: filter_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getCancerTypeFilter_200_response"
          description: Success response
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getCancerTypeFilter_404_response"
          description: Not found
      security:
      - bearerAuth: []
      summary: Get a single cancer type filter
      tags:
      - CancerTypeFilter
      x-accepts:
      - application/json
  /api/v1/collections:
    get:
      deprecated: true
      description: Returns a list of collections
      operationId: fetch_all_collections
      parameters:
      - description: Filter collections by name
        explode: true
        in: query
        name: name
        required: false
        schema:
          type: string
        style: form
      - description: Filter collections by team ID
        explode: true
        in: query
        name: team_id
        required: false
        schema:
          type: integer
        style: form
      - description: Filter collections by user ID
        explode: true
        in: query
        name: user_id
        required: false
        schema:
          type: integer
        style: form
      - description: Filter collections by title
        explode: true
        in: query
        name: title
        required: false
        schema:
          type: string
        style: form
      - description: "Filter collections by status (DRAFT, ACTIVE, ARCHIVED)"
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: per page
        example: "1"
        explode: true
        in: query
        name: per_page
        required: false
        schema:
          description: per page
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fetch_all_collections_200_response"
          description: Success
      security:
      - bearerAuth: []
      summary: CollectionController@index
      tags:
      - Collections
      x-accepts:
      - application/json
  /api/v1/collections/count/{field}:
    get:
      deprecated: true
      description: Get Counts for distinct entries of a field in the model
      operationId: count_unique_fields_collections
      parameters:
      - description: name of the field to perform a count on
        example: status
        explode: false
        in: path
        name: field
        required: true
        schema:
          description: status field
          type: string
        style: simple
      - description: team id
        example: "1"
        explode: true
        in: query
        name: team_id
        required: true
        schema:
          description: team id
          type: integer
        style: form
      - description: user id
        example: "1"
        explode: true
        in: query
        name: user_id
        required: true
        schema:
          description: user id
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/count_unique_fields_collections_200_response"
          description: Success response
      security:
      - bearerAuth: []
      summary: CollectionController@count
      tags:
      - Collections
      x-accepts:
      - application/json
  /api/v1/collections/{id}:
    get:
      deprecated: true
      description: Get collection by id
      operationId: fetch_collections
      parameters:
      - description: collection id
        example: "1"
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: collection id
          type: integer
        style: simple
      - description: Query flag to show full collection data or a trimmed version
          (defaults to full).
        example: full
        explode: true
        in: query
        name: view_type
        required: false
        schema:
          default: full
          description: Flag to show all data ('full') or trimmed data ('mini')
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fetch_collections_200_response"
          description: Success response
      security:
      - bearerAuth: []
      summary: CollectionController@show
      tags:
      - Collections
      x-accepts:
      - application/json
  /api/v1/csat:
    post:
      description: Creates a customer satisfaction score between 0 and 5
      operationId: create_csat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/create_csat_request"
        description: Customer Satisfaction score
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/delete_applications_200_response"
          description: Resource Created
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_csat_422_response"
          description: Validation Error
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_applications_500_response"
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Create Customer Satisfaction Score
      tags:
      - CustomerSatisfaction
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/csat/{id}:
    patch:
      description: Update a description for a satisfaction score entry
      operationId: edit_csat
      parameters:
      - description: ID of the CSAT entry
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/edit_csat_request"
        description: Reason to update
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/edit_csat_200_response"
          description: Update successful
      security:
      - bearerAuth: []
      summary: Update Customer Satisfaction Description
      tags:
      - CustomerSatisfaction
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/dar-integration:
    get:
      description: Returns a list of DAR integrations enabled on the system
      operationId: fetch_all_dar_integrations
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fetch_all_dar_integrations_200_response"
          description: Success
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fetch_all_dar_integrations_401_response"
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: DarIntegration@index
      tags:
      - DarIntegration
      x-accepts:
      - application/json
  /api/v1/dar-integration/{id}:
    get:
      description: Returns a single DAR integration enabled on the system
      operationId: fetch_dar_integration
      parameters:
      - description: dar integration id
        example: "1"
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: dar integration id
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fetch_all_dar_integrations_200_response_data_inner"
          description: Success
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fetch_all_dar_integrations_401_response"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/update_applications_404_response"
          description: Not found response
      security:
      - bearerAuth: []
      summary: DarIntegration@show
      tags:
      - DarIntegration
      x-accepts:
      - application/json
    patch:
      description: Edit a DAR integration enabled on the system
      operationId: edit_dar_integration
      parameters:
      - description: dar integration id
        example: "1"
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: dar integration id
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/edit_dar_integration_request"
        description: DarIntegration definition
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/update_dar_integration_200_response"
          description: Updated
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fetch_all_dar_integrations_401_response"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_applications_500_response"
          description: Error
      security:
      - bearerAuth: []
      summary: DarIntegration@edit
      tags:
      - DarIntegration
      x-content-type: application/json
      x-accepts:
      - application/json
    post:
      description: Creates a new DAR integration enabled on the system
      operationId: create_dar_integration
      parameters:
      - description: dar integration id
        example: "1"
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: dar integration id
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/update_dar_integration_request"
        description: DarIntegration definition
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_dar_integration_201_response"
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fetch_all_dar_integrations_401_response"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_applications_500_response"
          description: Error
      security:
      - bearerAuth: []
      summary: DarIntegration@store
      tags:
      - DarIntegration
      x-content-type: application/json
      x-accepts:
      - application/json
    put:
      description: Updates a DAR integration enabled on the system
      operationId: update_dar_integration
      parameters:
      - description: dar integration id
        example: "1"
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: dar integration id
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/update_dar_integration_request"
        description: DarIntegration definition
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/update_dar_integration_200_response"
          description: Updated
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fetch_all_dar_integrations_401_response"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_applications_500_response"
          description: Error
      security:
      - bearerAuth: []
      summary: DarIntegration@update
      tags:
      - DarIntegration
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/dar-integrations/{id}:
    delete:
      description: Delete a system Dar Integration
      operationId: delete_dar_integration
      parameters:
      - description: dar integration id
        example: "1"
        explode: false
        in: path
        name: id
        required: true
        schema:
          description: dar integration id
          type: integer
        style: simple
      responses:
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/update_applications_404_response"
          description: Not found response
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/delete_applications_200_response"
          description: Success
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_applications_500_response"
          description: Error
