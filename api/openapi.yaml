paths:
  /api/v1/datasets/admin_ctrl/trigger/term_extraction:
    post:
      description: Triggers the term extraction job for datasets within a specified
        range and controls whether data is partially indexed in Elasticsearch.
      operationId: create_datasets_term_extraction
      parameters:
      - description: "JWT token for authorization in the format 'Bearer {token}'"
        explode: false
        in: header
        name: Authorization
        required: true
        schema:
          type: string
        style: simple
      - description: "Role required to access this endpoint, e.g., 'hdruk.superadmin'"
        explode: false
        in: header
        name: role
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/create_datasets_term_extraction_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_datasets_term_extraction_200_response"
          description: Term extraction triggered successfully
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_datasets_term_extraction_500_response"
          description: Internal server error
      security:
      - jwt: []
      summary: Trigger Term Extraction for Datasets
      tags:
      - Datasets
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/datasets/admin_ctrl/trigger/linkage_extraction:
    post:
      description: Triggers the term extraction job for datasets within a specified
        range and controls whether data is partially indexed in Elasticsearch.
