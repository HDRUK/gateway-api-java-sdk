components:
  examples:
    filtersExample:
      summary: Example Filters payload
      value:
        filters:
          dataset:
            publisherName:
            - BREATHE
            - HDRUK
            populationSize:
              includeUnreported: true
              from: 100
              to: 1000
    filterPublicationsExample:
      summary: Example Filters payload for searching publications
      value:
        filters:
          paper:
            publicationType:
            - Journal Article
            - Preprint
            publicationDate:
            - "2020"
            - "2024"
  responses:
    "404":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/update_applications_404_response"
      description: Not found response
  schemas:
    Alias:
      description: An alias used to label a team or dataset
      properties:
        id:
          example: 1
          type: integer
        name:
          example: Also known as XYZ
          type: string
      type: object
    Category:
      description: A tool category record
      properties:
        id:
          example: 1
          type: integer
        name:
          example: Data Analysis
          type: string
        enabled:
          example: true
          type: boolean
        created_at:
          example: 2024-01-15T10:30:00Z
          format: date-time
          type: string
        updated_at:
          example: 2024-06-01T08:00:00Z
          format: date-time
          type: string
      type: object
    Collection:
      description: "A curated collection of datasets, tools, publications and DURs"
      example:
        id: 10
        name: Cardiovascular Research
        description: description
        image_link: /collections/cardio.jpg
        enabled: true
        keywords: keywords
        public: true
        counter: 0
        status: ACTIVE
        team_id: 0
        created_at: 2024-01-15T10:30:00Z
        updated_at: 2024-06-01T08:00:00Z
      properties:
        id:
          example: 10
          type: integer
        name:
          example: Cardiovascular Research
          type: string
        description:
          nullable: true
          type: string
        image_link:
          example: /collections/cardio.jpg
          nullable: true
          type: string
        enabled:
          example: true
          type: boolean
        keywords:
          nullable: true
          type: string
        public:
          example: true
          nullable: true
          type: boolean
        counter:
          example: 0
          nullable: true
          type: integer
        status:
          enum:
          - ACTIVE
          - DRAFT
          - ARCHIVED
          example: ACTIVE
          type: string
        team_id:
          nullable: true
          type: integer
        created_at:
          example: 2024-01-15T10:30:00Z
          format: date-time
          type: string
        updated_at:
          example: 2024-06-01T08:00:00Z
          format: date-time
          type: string
      type: object
    DataAccessApplication:
      description: A Data Access Application (DAR) record managed by the Gateway
      example:
        id: 1
        applicant_id: 42
        project_title: An investigation into cardiovascular outcomes
        project_id: "43"
        application_type: FORM
        submission_status: DRAFT
        approval_status: APPROVED
        is_joint: false
        status_review_id: 12
        created_at: 2024-01-15T10:30:00Z
        updated_at: 2024-06-01T08:00:00Z
        deleted_at: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          example: 1
          type: integer
        applicant_id:
          example: 42
          type: integer
        project_title:
          example: An investigation into cardiovascular outcomes
          nullable: true
          type: string
        project_id:
          example: "43"
          nullable: true
          type: string
        application_type:
          example: FORM
          type: string
        submission_status:
          enum:
          - DRAFT
          - SUBMITTED
          - FEEDBACK
          example: DRAFT
          type: string
        approval_status:
          enum:
          - APPROVED
          - APPROVED_COMMENTS
          - REJECTED
          - WITHDRAWN
          example: APPROVED
          nullable: true
          type: string
        is_joint:
          example: false
          type: boolean
        status_review_id:
          example: 12
          nullable: true
          type: integer
        created_at:
          example: 2024-01-15T10:30:00Z
          format: date-time
          type: string
        updated_at:
          example: 2024-06-01T08:00:00Z
          format: date-time
          type: string
        deleted_at:
          format: date-time
          nullable: true
          type: string
