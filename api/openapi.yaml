        explode: true
        in: query
        name: status
        required: false
        schema:
          description: Dataset status to filter by
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fetch_all_datasets_200_response"
